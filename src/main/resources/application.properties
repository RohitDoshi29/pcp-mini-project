# ===================================================================
# Spring Boot Configuration File
# This file configures database connection, server port, and tools.
# ===================================================================

# Application Name
spring.application.name=activity-tracker

# Server Port
server.port=8080

# -------------------------------------------------------------------
# H2 Database Settings (In-Memory Database, no setup needed)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# Swagger / OpenAPI Settings (API Documentation at http://localhost:8080/swagger-ui.html)
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

