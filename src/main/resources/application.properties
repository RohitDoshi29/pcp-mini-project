# ===================================================================
# [PRESENTATION POINT] CONFIGURATION: application.properties
# ===================================================================
# - ROLE: Central configuration for Spring Boot, embedded database, and tools.
# - CONCEPTS:
#   1. Zero External Setup: Uses H2 in-memory SQL database—runs instantly anywhere
#      without requiring MySQL, PostgreSQL, or Docker installation.
#   2. H2 Console: Web-based database management UI at /h2-console to inspect raw tables.
#   3. Hibernate JPA: Automatically manages table schemas and prints formatted SQL to console.
#   4. Swagger OpenAPI: Auto-generates interactive API docs at /swagger-ui.html.
# ===================================================================

# Application Name
spring.application.name=activity-tracker

# Embedded Tomcat Server Port
server.port=8080

# -------------------------------------------------------------------
# [PRESENTATION POINT] H2 In-Memory Database Configuration
# -------------------------------------------------------------------
# JDBC URL: "jdbc:h2:mem:fitnessdb" runs entirely in RAM for high speed during development.
# DB_CLOSE_DELAY=-1 keeps database alive as long as Spring Boot is running.
spring.datasource.url=jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# [PRESENTATION POINT] JPA & Hibernate ORM Settings
# -------------------------------------------------------------------
# Dialect specifies SQL dialect for H2 database
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ddl-auto=update automatically creates or updates SQL tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# show-sql prints all executed SQL queries in the console for debugging & presentation
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# -------------------------------------------------------------------
# [PRESENTATION POINT] H2 Web Console UI
# -------------------------------------------------------------------
# Access web UI at: http://localhost:8080/h2-console
# Login credentials:
#   JDBC URL: jdbc:h2:mem:fitnessdb
#   User Name: sa
#   Password: (leave blank)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# -------------------------------------------------------------------
# [PRESENTATION POINT] Swagger / OpenAPI Interactive Documentation
# -------------------------------------------------------------------
# Interactive API documentation and test bench at: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


